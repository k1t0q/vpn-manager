name: Validate AWG migration
on:
  push:
    branches: [awg-migration-2026-11]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r server/requirements.txt
      - run: python -m unittest discover -s tests -p '*_test.py' -v
      - run: node --test tests/recovery.test.mjs
      - run: node --check sqlite-manager.js
      - run: python -m compileall -q server
