name: Validate AWG migration
on:
  push:
    branches: [awg-migration-2026-11]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: 'Optional full SHA of a previously healthy staging release'
        required: false
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r server/requirements.txt
      - run: python -m unittest discover -s tests -p '*_test.py' -v
      - run: node --test tests/recovery.test.mjs
      - run: node --check sqlite-manager.js
      - run: python -m compileall -q server

  deploy_staging:
    needs: test
    if: ${{ vars.STAGING_DEPLOY_ENABLED != 'false' && github.ref == 'refs/heads/awg-migration-2026-11' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !inputs.rollback_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: vpn-staging
    concurrency:
      group: vpn-manager-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy isolated staging release
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_SSH_KEY }}
          HOST_FINGERPRINT: ${{ secrets.STAGING_HOST_FINGERPRINT }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash deploy/actions-ssh.sh
  rollback_staging:
    if: ${{ vars.STAGING_DEPLOY_ENABLED != 'false' && github.ref == 'refs/heads/awg-migration-2026-11' && github.event_name == 'workflow_dispatch' && inputs.rollback_sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: vpn-staging
    concurrency:
      group: vpn-manager-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Restore previously healthy staging release
        env:
          DEPLOY_ACTION: rollback
          DEPLOY_KEY: ${{ secrets.STAGING_SSH_KEY }}
          HOST_FINGERPRINT: ${{ secrets.STAGING_HOST_FINGERPRINT }}
          RELEASE_SHA: ${{ inputs.rollback_sha }}
        run: bash deploy/actions-ssh.sh

