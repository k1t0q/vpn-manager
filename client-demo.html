<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0a0d"><title>CAESAR VPN — личный кабинет (демо)</title><style>
:root{color-scheme:dark;font-family:Inter,Onest,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#090a0d;color:#f6f5f2}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#30221d 0%,#101014 37%,#090a0d 76%)}button{font:inherit;cursor:pointer} .shell{max-width:460px;margin:auto;padding:25px 19px 65px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}.brand{display:flex;align-items:center;gap:11px}.seal{height:43px;width:43px;border:1px solid #a77d4e;border-radius:13px;background:linear-gradient(135deg,#29211b,#100e0d);display:grid;place-items:center;color:#e4b978;font-family:Georgia,serif;font-size:26px}.brand b{letter-spacing:2.3px;font-size:16px}.brand small{display:block;color:#99939a;font-size:10px;letter-spacing:2px;margin-top:4px}.demo{border:1px solid #635038;color:#d3b58d;padding:7px 9px;border-radius:8px;font-size:10px;letter-spacing:1px}.greet{font-size:13px;color:#a7a3a8;margin:0 0 8px}.headline{font-size:28px;letter-spacing:-.7px;margin:0 0 23px;font-weight:750}.panel{border:1px solid #2c2b31;border-radius:19px;background:linear-gradient(155deg,#1a1a20,#111216);padding:20px;margin-bottom:13px;box-shadow:0 12px 40px #0002}.subtle{font-size:12px;color:#a6a2a6}.between{display:flex;align-items:center;justify-content:space-between;gap:12px}.status{color:#8bd7ad;background:#173526;border:1px solid #2a6548;border-radius:50px;font-size:11px;padding:7px 10px}.big{font-size:31px;font-weight:750;margin:14px 0 4px}.line{height:1px;background:#2b2a30;margin:17px 0}.meter{height:6px;border-radius:8px;background:#343039;overflow:hidden;margin:15px 0 10px}.meter i{display:block;width:66%;height:100%;background:linear-gradient(90deg,#b78349,#efc994);border-radius:8px}.gold{color:#eac393}.section{display:flex;justify-content:space-between;align-items:center;margin:26px 0 13px}.section h2{font-size:17px;margin:0}.section span{font-size:12px;color:#b6a086}.profile{display:flex;align-items:center;gap:13px;padding:15px 16px;background:#17181e;border:1px solid #2c2d34;border-radius:14px;margin-bottom:9px;cursor:pointer;width:100%;color:inherit;text-align:left}.profile.selected{border-color:#b28a57;background:#221d1b}.device{width:41px;height:41px;border-radius:12px;background:#27262b;display:grid;place-items:center;font-size:20px}.profile .meta{flex:1}.profile strong{display:block;font-size:14px;margin-bottom:5px}.profile small{color:#9d9ca5;font-size:11px}.arrow{color:#9d9184;font-size:19px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:17px}.btn{border:0;border-radius:12px;padding:14px 9px;font-weight:700;font-size:13px;background:linear-gradient(120deg,#d1a36b,#f1d2a0);color:#211710}.btn.alt{background:#2b292b;color:#e9e6e4;border:1px solid #4a4340}.foot{font-size:11px;color:#77767c;text-align:center;margin-top:23px;line-height:1.6}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.dialog{max-width:410px;width:100%;background:#1b1a20;border:1px solid #544335;border-radius:20px;padding:24px}.dialog h3{margin:0 0 12px}.dialog p{color:#b4afb4;font-size:13px;line-height:1.6}.dialog button{width:100%;margin-top:12px}</style></head><body><main class="shell"><header class="top"><div class="brand"><div class="seal">C</div><div><b>CAESAR</b><small>VPN · PRIVATE ACCESS</small></div></div><span class="demo">ДЕМО</span></header><p class="greet">Личный кабинет</p><h1 class="headline">Ваш VPN под контролем</h1><section class="panel"><div class="between"><span class="subtle">Подписка</span><span class="status">● Активна</span></div><div class="big">6 месяцев</div><div class="subtle">Тестовые данные · срок и тариф условные</div><div class="meter"><i></i></div><div class="between"><span class="subtle">Осталось</span><b class="gold">120 дней</b></div><div class="line"></div><div class="between"><span class="subtle">VPN-профилей</span><b id="counter">1</b></div></section><div class="section"><h2>Мои подключения</h2><span>Выберите устройство</span></div><div id="profiles"></div><div class="actions"><button class="btn" id="connect">Подключить VPN</button><button class="btn alt" id="instruction">Инструкция</button></div><p class="foot">Демонстрационный кабинет. Реальные ключи, данные клиентов и VPN-сервер не используются.</p></main><div class="modal" id="modal"><div class="dialog"><h3 id="modalTitle"></h3><p id="modalBody"></p><button class="btn" id="close">Понятно</button></div></div><script>
const profiles=[{name:"Телефон",type:"iPhone / Android",icon:"◈"},{name:"Ноутбук",type:"Windows / macOS",icon:"▣"}];let selected=0;const $=id=>document.getElementById(id);function render(){$("profiles").innerHTML=profiles.map((p,i)=>'<button class="profile '+(i===selected?'selected':'')+'" data-i="'+i+'"><span class="device">'+p.icon+'</span><span class="meta"><strong>'+p.name+'</strong><small>'+p.type+' · демонстрационный профиль</small></span><span class="arrow">›</span></button>').join('');document.querySelectorAll(".profile").forEach(b=>b.onclick=()=>{selected=Number(b.dataset.i);render()})}$("counter").textContent=profiles.length;render();function show(t,b){$("modalTitle").textContent=t;$("modalBody").textContent=b;$("modal").classList.add("show")}$("connect").onclick=()=>show("Подключение: "+profiles[selected].name,"В рабочей версии здесь появится защищённая выдача персонального QR-кода или конфигурации WireGuard. Сейчас это только демонстрация: VPN не включается и ключи не передаются.");$("instruction").onclick=()=>show("Как подключиться","1. Установите приложение WireGuard. 2. Получите свой персональный профиль в кабинете. 3. Импортируйте профиль в WireGuard и подтвердите подключение. В демо настоящих профилей нет.");$("close").onclick=()=>$("modal").classList.remove("show");$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").classList.remove("show")};
</script></body></html>
