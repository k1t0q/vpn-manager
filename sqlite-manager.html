<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VPN MANAGER — SQLite</title><link rel="stylesheet" href="styles.css?v=5.16">
<style>
.m-wrap{max-width:1400px;margin:24px auto;padding:16px}.m-grid{display:grid;grid-template-columns:310px minmax(0,1fr);gap:18px}.m-panel{padding:20px;background:#191d25;border:1px solid #303744;border-radius:14px}.m-panel label{display:block;margin:12px 0}.m-panel input,.m-panel select{width:100%}.m-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}.m-tools input{flex:1;min-width:180px}.m-scroll{overflow:auto}.m-scroll table{width:100%;min-width:920px}.m-scroll td,.m-scroll th{padding:10px;text-align:left;vertical-align:middle}.m-actions{display:flex;gap:6px;flex-wrap:wrap}.m-actions button{white-space:nowrap}.m-muted{color:#aeb4c2}.m-error{color:#ff7777}.m-ok{color:#65d8a1}.m-hide{display:none!important}@media(max-width:800px){.m-grid{grid-template-columns:1fr}}
</style></head><body><div class="m-wrap">
<header><div><h1>VPN MANAGER <span>k1t0</span></h1><p>Управление подписками · SQLite</p></div><a href="index.html">Старая панель</a></header>
<section id="loginPane" class="m-panel"><form id="login"><label>Код администратора<input id="code" type="password" required autocomplete="off"></label><button>Войти</button></form></section>
<section id="workspace" class="m-hide">
<div class="m-tools"><button id="reload" class="secondary">Обновить</button><button id="logout" class="secondary">Выйти</button><span id="counts"></span></div>
<div class="m-grid"><aside class="m-panel"><h2>Новый клиент</h2>
<form id="create"><label>Имя<input name="name" required maxlength="150"></label><label>Телефон<input name="phone"></label><label>Начало<input name="start_date" type="date" required></label><label>Тариф<select name="period"><option value="1m">1 месяц</option><option value="6m">6 месяцев</option><option value="12m">12 месяцев</option><option value="lifetime">Навсегда ∞</option></select></label><label>Пригласил<select name="referrer_id" id="referrer"><option value="">Никто</option></select></label><label>Заметка<input name="note"></label><button type="submit">Создать в SQLite</button></form>
<p class="m-muted">Создание записи пока не создаёт WireGuard-профиль. Автоматическая связка будет добавлена отдельно.</p>
</aside><main class="m-panel"><h2>Клиенты</h2><div class="m-tools"><input id="search" placeholder="Поиск по имени, телефону"><select id="filter"><option value="all">Все</option><option value="active">Активные</option><option value="expired">Истекли</option><option value="lifetime">Бессрочные</option></select></div>
<div class="m-scroll"><table><thead><tr><th>Клиент</th><th>Телефон</th><th>Тариф</th><th>Окончание</th><th>WireGuard</th><th>Действия</th></tr></thead><tbody id="rows"></tbody></table></div></main></div>
</section><p id="status" role="status"></p>
<dialog id="historyDialog"><div class="m-panel"><h2>История клиента</h2><div id="history"></div><button id="closeHistory" class="secondary">Закрыть</button></div></dialog>
</div><script src="sqlite-manager.js?v=1"></script></body></html>
