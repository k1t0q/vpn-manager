<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VPN MANAGER — SQLite staging</title><link rel="stylesheet" href="styles.css">
<style>.staging-wrap{max-width:1250px;margin:32px auto;padding:16px}.staging-controls{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.staging-controls label{flex:1;min-width:200px}.staging-controls input{width:100%}.staging-note{margin:12px 0;color:#aeb4c2}.staging-table{overflow:auto}.staging-table table{width:100%}.staging-table td,.staging-table th{padding:12px;text-align:left}.staging-error{color:#ff7777}</style></head><body>
<div class="staging-wrap">
<header><div><h1>VPN MANAGER <span>k1t0</span></h1><p>SQLite — тестовый режим</p></div><a href="index.html">Основная панель</a></header>
<p class="staging-note">Только чтение. Действующие VPN-профили и подписки эта страница не изменяет.</p>
<form id="connect" class="staging-controls">
<label>Адрес тестового API<input id="endpoint" type="url" value="https://vpn-staging.80-90-179-65.sslip.io" readonly required autocomplete="url"></label>
<label>Код администратора<input id="code" type="password" required autocomplete="off"></label>
<button type="submit">Подключиться</button><button type="button" id="logout" class="secondary">Выйти</button>
</form>
<p id="status" role="status"></p>
<section id="result" hidden>
<div class="stats"><div><small>Всего</small><b id="total">0</b></div><div><small>Бессрочные</small><b id="lifetime">0</b></div><div><small>Со сроком</small><b id="dated">0</b></div></div>
<div class="staging-controls"><label>Поиск<input id="search" placeholder="Имя или телефон"></label><button type="button" id="refresh" class="secondary">Обновить</button></div>
<div class="staging-table"><table><thead><tr><th>Клиент</th><th>Телефон</th><th>Тариф</th><th>Начало</th><th>Окончание</th><th>WG ID</th></tr></thead><tbody id="rows"></tbody></table></div>
</section></div><script src="sqlite-preview.js"></script></body></html>
